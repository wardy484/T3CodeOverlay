name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  package:
    name: Package release
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          Invoke-WebRequest https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip "$env:APPDATA\XIVLauncher\addon\Hooks\dev"

      - name: Restore locked dependencies
        run: dotnet restore Browsingway/Browsingway.csproj --locked-mode -p:Platform=x64

      - name: Build release package
        run: dotnet build Browsingway/Browsingway.csproj --configuration Release --no-restore -p:Platform=x64

      - name: Validate package and tag
        shell: pwsh
        run: |
          ./scripts/Test-Package.ps1
          $manifest = Get-Content out/T3CodeOverlay/T3CodeOverlay.json -Raw | ConvertFrom-Json
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          if ($manifest.AssemblyVersion -ne $tagVersion) {
            throw "Tag $tagVersion does not match package version $($manifest.AssemblyVersion)."
          }

      - name: Generate checksum and custom repository
        shell: pwsh
        run: |
          $hash = (Get-FileHash out/T3CodeOverlay/latest.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  latest.zip" | Set-Content out/T3CodeOverlay/SHA256SUMS -Encoding ascii
          ./scripts/New-CustomRepo.ps1

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/T3CodeOverlay/latest.zip out/T3CodeOverlay/SHA256SUMS --verify-tag --generate-notes --title "T3 Code Overlay ${{ github.ref_name }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Publish custom repository
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
