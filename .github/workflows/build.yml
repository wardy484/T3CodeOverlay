name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  windows:
    name: Windows package
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          Invoke-WebRequest https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip "$env:APPDATA\XIVLauncher\addon\Hooks\dev"

      - name: Restore locked dependencies
        run: dotnet restore Browsingway/Browsingway.csproj --locked-mode -p:Platform=x64

      - name: Build release package
        run: dotnet build Browsingway/Browsingway.csproj --configuration Release --no-restore -p:Platform=x64

      - name: Validate package
        shell: pwsh
        run: |
          ./scripts/Test-Package.ps1
          ./scripts/New-CustomRepo.ps1
          Get-Content site/repo.json -Raw | ConvertFrom-Json | Out-Null

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: T3CodeOverlay-windows-x64
          path: out/T3CodeOverlay/latest.zip
          if-no-files-found: error
          retention-days: 14
