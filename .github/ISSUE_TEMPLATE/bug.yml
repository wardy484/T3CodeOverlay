name: Bug report
description: Report a reproducible problem with T3 Code Overlay.
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux / Wine
        - XIV on Mac
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin, Dalamud, and T3 Code versions.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials and private information. Do not upload the entire log blindly.
      render: text
